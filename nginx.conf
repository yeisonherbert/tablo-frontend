server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache largo para assets con hash en el nombre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: cualquier ruta desconocida sirve index.html
  # para que vue-router (history mode) maneje el enrutado en el cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
